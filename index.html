<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تعلم الحروف العربية - Kidsy</title>
<style>
body{font-family:system-ui;background:#FFF8E7;margin:0;text-align:center}
h1{color:#FF6B6B}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:20px;max-width:400px;margin:auto}
.letter{background:white;border-radius:20px;padding:20px;font-size:32px;box-shadow:0 4px 10px #0001;cursor:pointer}
.letter:active{transform:scale(0.9)}
#display{font-size:80px;margin:20px;background:white;border-radius:30px;padding:20px;max-width:300px;margin:20px auto;box-shadow:0 4px 20px #0002}
</style>
</head>
<body>
<h1>🌙 تعلم الحروف العربية</h1>
<div id="display">اضغطي على حرف 👇</div>
<div class="grid" id="grid"></div>
<script>
const letters=[
{a:'أ',w:'أرنب'},{a:'ب',w:'بطة'},{a:'ت',w:'تفاحة'},{a:'ث',w:'ثعلب'},
{a:'ج',w:'جمل'},{a:'ح',w:'حصان'},{a:'خ',w:'خروف'},{a:'د',w:'دب'},
{a:'ذ',w:'ذئب'},{a:'ر',w:'رمان'},{a:'ز',w:'زرافة'},{a:'س',w:'سمكة'},
{a:'ش',w:'شمس'},{a:'ص',w:'صقر'},{a:'ض',w:'ضفدع'},{a:'ط',w:'طائرة'},
{a:'ظ',w:'ظرف'},{a:'ع',w:'عصفور'},{a:'غ',w:'غزال'},{a:'ف',w:'فيل'},
{a:'ق',w:'قرد'},{a:'ك',w:'كتاب'},{a:'ل',w:'ليمون'},{a:'م',w:'موز'},
{a:'ن',w:'نمر'},{a:'ه',w:'هلال'},{a:'و',w:'وردة'},{a:'ي',w:'يد'}
];
const grid=document.getElementById('grid');
const display=document.getElementById('display');
letters.forEach(l=>{
const d=document.createElement('div');
d.className='letter';d.textContent=l.a;
d.onclick=()=>{
display.innerHTML=`${l.a}<br><small style="font-size:30px">${l.w}</small>`;
let u=new SpeechSynthesisUtterance(l.a+" "+l.w);
u.lang='ar-SA';u.rate=0.8;
speechSynthesis.speak(u);
};
grid.appendChild(d);
});
</script>
</body>
</html>
