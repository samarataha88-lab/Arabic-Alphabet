<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kidsy - الحروف</title>
<style>
body{background:#FFF8E7;font-family:sans-serif;text-align:center;margin:0}
h1{color:#ff6b6b;margin:15px}
#show{background:#fff;border-radius:25px;padding:20px;width:85%;max-width:300px;margin:10px auto;min-height:100px;font-size:60px;box-shadow:0 5px 15px #0001}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:15px;max-width:380px;margin:auto}
.b{background:#fff;border-radius:15px;padding:15px 5px;font-size:26px;box-shadow:0 3px 8px #0001;cursor:pointer}
.b:active{background:#ff6b6b;color:#fff}
</style></head>
<body>
<h1>🌙 تعلم الحروف العربية</h1>
<div id="show">دوسي على أي حرف 👇</div>
<div class="grid">
<div class="b" onclick="say('أ','ألف','أرنب')">أ</div><div class="b" onclick="say('ب','باء','بطة')">ب</div><div class="b" onclick="say('ت','تاء','تفاحة')">ت</div><div class="b" onclick="say('ث','ثاء','ثعلب')">ث</div>
<div class="b" onclick="say('ج','جيم','جمل')">ج</div><div class="b" onclick="say('ح','حاء','حصان')">ح</div><div class="b" onclick="say('خ','خاء','خروف')">خ</div><div class="b" onclick="say('د','دال','دب')">د</div>
<div class="b" onclick="say('ذ','ذال','ذئب')">ذ</div><div class="b" onclick="say('ر','راء','رمان')">ر</div><div class="b" onclick="say('ز','زاي','زرافة')">ز</div><div class="b" onclick="say('س','سين','سمكة')">س</div>
<div class="b" onclick="say('ش','شين','شمس')">ش</div><div class="b" onclick="say('ص','صاد','صقر')">ص</div><div class="b" onclick="say('ض','ضاد','ضفدع')">ض</div><div class="b" onclick="say('ط','طاء','طائرة')">ط</div>
<div class="b" onclick="say('ظ','ظاء','ظرف')">ظ</div><div class="b" onclick="say('ع','عين','عصفور')">ع</div><div class="b" onclick="say('غ','غين','غزال')">غ</div><div class="b" onclick="say('ف','فاء','فيل')">ف</div>
<div class="b" onclick="say('ق','قاف','قرد')">ق</div><div class="b" onclick="say('ك','كاف','كتاب')">ك</div><div class="b" onclick="say('ل','لام','ليمون')">ل</div><div class="b" onclick="say('م','ميم','موز')">م</div>
<div class="b" onclick="say('ن','نون','نمر')">ن</div><div class="b" onclick="say('ه','هاء','هلال')">ه</div><div class="b" onclick="say('و','واو','وردة')">و</div><div class="b" onclick="say('ي','ياء','يد')">ي</div>
</div>
<script>
let v=null;function loadV(){let vs=speechSynthesis.getVoices();v=vs.find(x=>x.lang.includes('ar'))||vs[0]};speechSynthesis.onvoiceschanged=loadV;loadV();
function say(letter,name,word){
document.getElementById('show').innerHTML=letter+'<div style="font-size:28px;margin-top:10px">'+word+'</div>';
speechSynthesis.cancel();
let u=new SpeechSynthesisUtterance('حرف '+name+' ، '+word);if(v)u.voice=v;u.lang='ar-SA';u.rate=0.8;
speechSynthesis.speak(u);
}
</script>
</body>
</html>
